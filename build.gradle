plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    mods {
        sable_compat {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation files('libs/Invincible Inc (Reboot) v1.4.2.jar')
    compileOnly files('libs/create-1.21.1-6.0.10.jar')
    compileOnly files('libs/create-aeronautics-bundled-1.21.1-1.3.0.jar')
    compileOnly fileTree(dir: 'libs', include: ['dev.simulated_team.simulated.simulated-*.jar'])
    compileOnly files('libs/sable-companion-common-1.21.1-1.6.0.jar')
    compileOnly files('libs/ponder-neoforge-1.0.82+mc1.21.1.jar')
    compileOnly files('libs/sable-neoforge-1.21.1-2.0.1.jar')
    compileOnly files('libs/jei-1.21.1-neoforge-19.27.0.340.jar')
    compileOnly files('libs/veil-neoforge-1.21.1-4.0.0.jar')
    compileOnly files('libs/ColdSweat-2.4.1.jar')
    compileOnly files('libs/theboysmod-1.0.0.1.jar')
    compileOnly fileTree(dir: 'libs', include: ['Jade-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['pointblank-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['createcybernetics-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['cbc_at*.jar', 'createbigcannons-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['powergrid-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['createaddition-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['tfmg-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['dev.eriksonn.aeronautics.aeronautics-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['createcybernetics-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['create_radar-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['cc-tweaked-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['cbcmodernwarfare-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['createpropulsion-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['aeroworks-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['Registrate-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['flywheel-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['ritchiesprojectilelib-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['drivebywire-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['crowns-*.jar'])
    // Ядро Immersive Portals (com.invfix.ip) — совместимость с Sodium и Iris.
    // Sodium: нужен ВНУТРЕННИЙ jar из sodium-neoforge-...jar → META-INF/jarjar/net.caffeinemc.sodium-neoforge-...-mod.jar
    compileOnly fileTree(dir: 'libs', include: ['net.caffeinemc.sodium-neoforge-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['iris-neoforge-*.jar'])
    compileOnly fileTree(dir: 'libs', include: ['createendertransmission-*.jar'])
}

// Указываем NeoForge что у нас есть Mixin конфиг
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
                'MixinConfigs': 'sable_compat.mixins.json'
        ])
    }
}